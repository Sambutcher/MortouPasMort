<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Mort ou pas mort ?</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mort ou pas">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body class="home">
  <main id="app">
    <section id="home">
      <h1>Quel jeu&nbsp;?</h1>
      <button class="mode-card" type="button" data-mode="mort">
        <span class="mode-title">Mort ou pas mort&nbsp;?</span>
        <span class="mode-sub">Cette personnalité est-elle encore en vie&nbsp;?</span>
      </button>
      <button class="mode-card" type="button" data-mode="condamne">
        <span class="mode-title">Condamné ou pas condamné&nbsp;?</span>
        <span class="mode-sub">A-t-elle déjà été condamnée par la justice&nbsp;? Seules comptent les condamnations définitives, non annulées.</span>
      </button>
    </section>

    <header id="game-header">
      <button id="btn-home" type="button" aria-label="Changer de jeu">&#8592;</button>
      <h1 id="title">Mort ou pas mort&nbsp;?</h1>
    </header>

    <section id="card" aria-live="polite">
      <div id="photo-wrap">
        <img id="photo" alt="">
        <div id="no-photo" hidden>?</div>
      </div>
      <h2 id="name"></h2>
      <p id="description"></p>
    </section>

    <section id="result" hidden aria-live="polite">
      <p id="verdict"></p>
      <p id="detail"></p>
      <p id="source" hidden><a target="_blank" rel="noopener">Source&nbsp;: Wikipédia</a></p>
    </section>

    <p id="error" hidden></p>

    <footer id="actions">
      <div id="choices">
        <button id="btn-dead" class="choice dead" type="button">Mort</button>
        <button id="btn-alive" class="choice alive" type="button">Pas mort</button>
      </div>
      <button id="btn-next" class="next" type="button" hidden>Suivant</button>
    </footer>

    <p id="credits">Données&nbsp;: <a href="https://www.wikidata.org" target="_blank" rel="noopener">Wikidata</a>, photos&nbsp;: Wikimedia Commons</p>
  </main>
  <script src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
