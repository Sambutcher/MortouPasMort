name: Validation de la liste « Condamné ou pas condamné »

on:
  schedule:
    - cron: '0 5 * * 1' # chaque lundi à 5 h UTC
  workflow_dispatch:
  push:
    # Revalide dès que la liste source ou le script change (sur n'importe quelle branche)
    paths:
      - data/convicts-source.json
      - scripts/update-convicts.mjs

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-convicts.mjs
      - name: Commit si la liste a changé
        run: |
          git add data/convicts.json data/convicts-report.md
          if git diff --cached --quiet; then
            echo "Aucun changement"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "Validation de la liste « Condamné ou pas condamné »"
          git push
